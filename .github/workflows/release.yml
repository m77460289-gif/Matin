name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          ls -la release-keystore.jks
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew 2>/dev/null || true

      - name: Build Release APK
        run: |
          if [ -f release-keystore.jks ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo 'No keystore, falling back to debug build'
            ./gradlew :app:assembleDebug --stacktrace
          fi
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PATH: release-keystore.jks

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/konkur-computer.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/konkur-computer.apk
          fi
          ls -la out/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: konkur-computer-apk
          path: out/konkur-computer.apk

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Konkur Computer ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: out/konkur-computer.apk
          body: |
            ### اپلیکیشن کنکور کامپیوتر فنی‌حرفه‌ای (شبکه و نرم‌افزار)
            - فایل نصبی: `konkur-computer.apk`
            - برنامه‌ریزی ۲ ساعت در روز (۱۲۰ دقیقه طلایی)
            - تحلیل تغییرات کتب درسی دهم، یازدهم و دوازدهم
            - تایمر تمرکز و بانک تست پودمان‌ها
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
