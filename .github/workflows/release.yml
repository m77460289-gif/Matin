name: Build & Release APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Philosophy:
#   - Pushes to main and tags with suffix (-beta, -test, -pre, -debug, -rc)
#     => build DEBUG APK, publish as PRE-RELEASE (untested / in progress)
#   - Clean semver tags (v1.2.3) => build SIGNED RELEASE APK,
#     publish as FULL RELEASE (tested / stable / safe)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode debug keystore (fallback)
        run: base64 -d debug.keystore.base64 > debug.keystore && ls -la debug.keystore

      - name: Determine build kind
        id: kind
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="${REF#refs/tags/}"
            if [[ "$TAG" =~ -(beta|test|pre|debug|rc) ]]; then
              echo "kind=pre" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Building PRE-RELEASE (debug) for tag $TAG"
            else
              echo "kind=stable" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Building FULL RELEASE (signed) for tag $TAG"
            fi
          else
            SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "kind=pre" >> "$GITHUB_OUTPUT"
            echo "tag=main-$SHA" >> "$GITHUB_OUTPUT"
            echo "Push to main - building PRE-RELEASE (debug) as main-$SHA"
          fi

      - name: Decode release keystore (stable only)
        if: steps.kind.outputs.kind == 'stable'
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            ls -la release-keystore.jks
          else
            echo "::error::RELEASE_KEYSTORE_BASE64 secret missing - cannot sign stable release"
            exit 1
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew 2>/dev/null || true

      - name: Run unit tests (sanity check)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APK (debug for pre, signed for stable)
        run: |
          if [ "${{ steps.kind.outputs.kind }}" = "stable" ]; then
            echo "Building SIGNED RELEASE APK"
            ./gradlew :app:assembleRelease --stacktrace
          else
            echo "Building DEBUG APK (untested)"
            ./gradlew :app:assembleDebug --stacktrace
          fi
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PATH: release-keystore.jks

      - name: Prepare APK artifact
        run: |
          mkdir -p out
          if [ "${{ steps.kind.outputs.kind }}" = "stable" ]; then
            cp app/build/outputs/apk/release/app-release.apk out/konkur-computer.apk
            echo "APK: SIGNED RELEASE" > out/BUILD_KIND.txt
          else
            cp app/build/outputs/apk/debug/app-debug.apk out/konkur-computer.apk
            echo "APK: DEBUG (pre-release, untested)" > out/BUILD_KIND.txt
          fi
          ls -la out/
          cat out/BUILD_KIND.txt

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: konkur-computer-apk-${{ steps.kind.outputs.tag }}
          path: |
            out/konkur-computer.apk
            out/BUILD_KIND.txt

      # --- PRE-RELEASE: debug / untested / beta ---
      - name: Publish PRE-RELEASE (debug APK)
        uses: softprops/action-gh-release@v2
        if: |
          steps.kind.outputs.kind == 'pre' && startsWith(github.ref, 'refs/tags/')
        with:
          name: "[BETA] Konkur Computer ${{ steps.kind.outputs.tag }}"
          tag_name: ${{ steps.kind.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: out/konkur-computer.apk
          body: |
            ### ⚠️ این یک نسخه **آزمایشی/تست‌نشده** است (Debug)
            - مناسب برای تست داخلی و بازخورد
            - ممکن است کرش کند یا ناقص باشد
            - لطفاً در **پری‌ریلیز** بمان و استفاده روزمره نکن

            ### اپلیکیشن کنکور کامپیوتر فنی‌حرفه‌ای
            - فایل نصبی: `konkur-computer.apk`
            - برنامه‌ریزی ۲ ساعت در روز
            - تحلیل ۱۲ کتاب تخصصی + برنامه سالانه + چک‌پوینت هفتگی
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- FULL RELEASE: signed / tested / stable ---
      - name: Publish FULL RELEASE (signed APK)
        uses: softprops/action-gh-release@v2
        if: |
          steps.kind.outputs.kind == 'stable' && startsWith(github.ref, 'refs/tags/')
        with:
          name: "Konkur Computer ${{ steps.kind.outputs.tag }} ✅"
          tag_name: ${{ steps.kind.outputs.tag }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: out/konkur-computer.apk
          body: |
            ### ✅ نسخه **پایدار و تست‌شده** (Release امضاشده)
            - APK بهینه، کوچک و سریع
            - روی نسخه قبلی نصب می‌شود (بدون حذف)
            - آماده استفاده روزمره

            ### اپلیکیشن کنکور کامپیوتر فنی‌حرفه‌ای (شبکه و نرم‌افزار)
            - برنامه‌ریزی ۲ ساعت در روز (۱۲۰ دقیقه طلایی)
            - تحلیل ۱۲ کتاب تخصصی + برنامه راهبردی تا کنکور
            - چک‌پوینت هفتگی یکشنبه/پنجشنبه
            - تایمر تمرکز، آزمونک، دفترچه نکات
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
